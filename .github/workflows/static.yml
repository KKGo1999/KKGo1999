# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Refresh delayed options data during US market hours on weekdays.
  schedule:
    - cron: "20,50 13-22 * * 1-5"

permissions:
  contents: read

# Keep a single Pages deployment lane. Newer runs cancel older in-progress
# deploys so scheduled refreshes or repeated pushes do not leave stale runs queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test options data and Agent exports
        run: npm test
      - name: Install test browsers
        if: github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium webkit
      - name: Test browser flows before publishing code
        if: github.event_name != 'schedule'
        run: npm run test:browser
      - name: Restore last successful market snapshot
        uses: actions/cache/restore@v5
        with:
          path: options/data
          key: options-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: options-snapshot-v1-
      - name: Refresh delayed options data
        id: refresh
        continue-on-error: true
        timeout-minutes: 7
        env:
          OPTIONS_REFRESH_REPORT: ${{ runner.temp }}/options-refresh-report.json
        run: npm run build:data
      - name: Cache successful snapshot
        if: steps.refresh.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: options/data
          key: options-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package fresh data
        id: package_fresh
        if: steps.refresh.outcome == 'success'
        run: npm run build
      - name: Package explicitly marked cached data
        id: package_cached
        if: steps.refresh.outcome != 'success'
        run: npm run build -- --cached
      - name: Summarize options refresh
        if: ${{ !cancelled() && steps.refresh.outcome != 'skipped' && steps.refresh.outcome != '' }}
        env:
          OPTIONS_REFRESH_REPORT: ${{ runner.temp }}/options-refresh-report.json
          OPTIONS_REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          OPTIONS_PACKAGE_OUTCOME: ${{ steps.refresh.outcome == 'success' && steps.package_fresh.outcome || steps.package_cached.outcome }}
        run: node scripts/summarize-options-refresh.js
      - name: Name Pages artifact
        id: artifact_name
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: 'dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install deployment dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Wait for Pages artifact
        timeout-minutes: 4
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const { checkPagesArtifact } = require('./scripts/wait-pages-artifact.js');
            await checkPagesArtifact();
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
