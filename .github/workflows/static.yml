# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Refresh delayed options data during US market hours on weekdays.
  schedule:
    - cron: "20,50 13-22 * * 1-5"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Keep a single Pages deployment lane. Newer runs cancel older in-progress
# deploys so scheduled refreshes or repeated pushes do not leave stale runs queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test options data and Agent exports
        run: npm test
      - name: Install test browsers
        if: github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium webkit
      - name: Test browser flows before publishing code
        if: github.event_name != 'schedule'
        run: npm run test:browser
      - name: Restore last successful market snapshot
        uses: actions/cache/restore@v5
        with:
          path: options/data
          key: options-snapshot-v1-${{ github.run_id }}
          restore-keys: options-snapshot-v1-
      - name: Refresh delayed options data
        id: refresh
        continue-on-error: true
        timeout-minutes: 7
        run: npm run build:data
      - name: Cache successful snapshot
        if: steps.refresh.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: options/data
          key: options-snapshot-v1-${{ github.run_id }}
      - name: Package fresh data
        if: steps.refresh.outcome == 'success'
        run: npm run build
      - name: Package explicitly marked cached data
        if: steps.refresh.outcome != 'success'
        run: npm run build -- --cached
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
